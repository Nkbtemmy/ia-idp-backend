server:
  port: 2080
spring:
  application:
    name: SSO
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:security_db}"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:admin123!}"
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: "${EMAIL_HOST:sandbox.smtp.mailtrap.io}"
    port: "${EMAIL_PORT:587}"
    username: "${EMAIL_USERNAME: 446b3b504773ad}"
    password: "${EMAIL_PASSWORD: a5b8a14aa6b496}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          linkedin:
            client-id: "${LINKEDIN_CLIENT_ID:7734567rewwdp}"
            client-secret: "${LINKEDIN_CLIENT_SECRET:WPL_AP1.N897657jhQ.bDrUJA==t}"
            client-name: LinkedIn
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - r_liteprofile
              - r_emailaddress
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/me
            user-name-attribute: id

private:
  key:
    path: certificates/private_key.pem
    password: yourpassword
public:
  key:
    path: certificates/public_key.pem
jwt:
  issuer: issub2sds



logging:
  level:
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.zaxxer.hikari.pool.HikariPool: DEBUG
    com.zaxxer.hikari.HikariDataSource: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.transaction: DEBUG

# Swagger configurations
springdoc:
  pathsToMatch: /api/**
  api-docs:
    path: /api/v1/sso-service
  swagger-ui:
    path: /api/v1/sso-service/docs
